    <script>
        function toggleDesc(num) {
            document.getElementsByClassName('desc-text')[num].classList.toggle('hidden');
        }

        const launcher = document.getElementById("launcher");
        const phrases = [
            "WashU '26 Grad",
            "Software Developer",
            "Designer",
            "Creator",
            "Full-stack Developer",
            "Co-founder of The Bobcat Press",
            "Co-founder of ORCHARD",
            "Sacramento Kings fan",
            "NBA enthusiast",
            "Lover of local music",
            "Virginia Woolf admirer",
            "Featured exhibitor at SLICE 2026",
            "Guitarist",
            "Are.na user",
            "Web surfer",
            "Owner of a valid US Driver's License",
            "Cat enjoyer",
            "Horse admirer",
            "Rabbit appreciator",
            "Origami crane expert",
            "Ball knower",
            "DIY web enthusiast",
            "Mythology enjoyer",
            "Team player",
            "Thinker of thoughts and ideas",
            "Physical media enjoyer",
            "Musician",
            "System",
            "Writer"
        ];

        launcher.addEventListener("click", (e) => {
            const particle = document.createElement("div");
            particle.className = "flying-text";
            particle.textContent = phrases[Math.floor(Math.random() * phrases.length)];

            const rect = launcher.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;
            particle.style.left = `${startX}px`;
            particle.style.top = `${startY}px`;

            const angle = Math.random() * Math.PI * 2;
            const w = window.innerWidth;
            const h = window.innerHeight;
            const distY = h / 6 + (Math.random() * h / 4);
            const distX = w / 7 + (Math.random() * w / 6);
            const x = Math.cos(angle) * distX;
            const y = Math.sin(angle) * distY;
            const rotation = `${(Math.random() - 0.5) * 180}deg`;

            particle.style.setProperty("--x", `${x}px`);
            particle.style.setProperty("--y", `${y}px`);
            particle.style.setProperty("--rot", rotation);

            document.body.appendChild(particle);
            particle.addEventListener("animationend", () => {
                particle.remove();
            });
        });
    </script>
