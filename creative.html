<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caleb Henry - Software Developer</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&family=Rock+3D&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div id="main">
        <div class="root-header">
            <a class="back" href="index.html">Back</a>
            <h1>misc.</h1>

            <div class="designs" id="works"></div>
        </div>

        <img id="main-img" src="imgs/roots.gif"/>
    </div>

    <script>
        let visuals = [
            {
                image: 'imgs/projects/visuals/bobcat.png',
                title: 'Writer for The Bobcat Press',
                tags: ['Writing', 'Management', 'Social Media'],
                desc: 'Co-founder of and contributing writer for The Bobcat Press, an independent music journalism organization based in St. Louis, MO.',
                link: 'https://thebobcatpress.substack.com'
            },
            {
                image: 'imgs/projects/COW.jpg',
                title: 'Guitarist in Amtrak & COW',
                tags: ['Music', 'Guitar'],
                desc: 'I\'ve been a part of two bands as a lead/rhythm guitarist. The first was COW, a punk adjacent three piece which did result in one demo EP. The second was Amtrak during my senior year in college, which resulted in some live performances, which was pretty cool.',
                link: 'https://open.spotify.com/album/1twYI5m9AVP5AE3uxk0e53?si=AjbksIvLSJqCy4rzEUsL_w'
            },
            {
                image: 'imgs/projects/balltalk.png',
                title: 'Co-host of the Ball Talk Podcast',
                tags: ['Video Editing', 'Audio', 'Graphic Design'],
                desc: 'A podcast I co-hosted that was mainly active from 2024-2025. We talked NBA basketball, and I did all the video editing and graphic elements. Among the podcasts were a few solo, scripted videos as well.',
                link: 'https://www.youtube.com/channel/UCQLCNyMhw2zrVEqQ01cnWog'
            },
            {
                image: 'imgs/projects/bosco.png',
                title: 'mobilebosco - Music Production',
                tags: ['GarageBand', 'FL Studio'],
                desc: 'A project I started in high school that is mostly inactive now. Two albums and three EPs from 2017 - 2022',
                link: 'https://open.spotify.com/artist/7mgrmbagtfERB9GMuS4ZyA'
            },
        ];

        function createProjectBlock(data) {
            let container = document.createElement('div');

            let thumb = document.createElement('div');
            thumb.classList.add('design-thumb');
            let img = document.createElement('img');
            img.src = data.image;
            thumb.appendChild(img);

            let infoBlock = document.createElement('div');
            infoBlock.classList.add('info');

            let title = document.createElement('div');
            title.classList.add('title');
            title.innerText = data.title;
            infoBlock.appendChild(title);

            let tags = document.createElement('div');
            tags.classList.add('tags');
            for (let t of data.tags) {
                let tag = document.createElement('div');
                tag.innerText = t;
                tags.appendChild(tag);
            }
            infoBlock.appendChild(tags);

            if (data.desc) {
                let details = document.createElement('details');
                let label = document.createElement('summary');
                label.innerText = "Summary";
                let desc = document.createElement('p');
                desc.innerText = data.desc;
                details.appendChild(label);
                details.appendChild(desc);
                 infoBlock.appendChild(details);
            }
            if (data.link) {
                let link = document.createElement('a');
                link.classList.add('design-link')
                link.target = '_blank';
                link.href = data.link;
                link.innerText = "Visit";
                infoBlock.appendChild(link);
            }

            container.appendChild(thumb);
            container.appendChild(infoBlock)
            return container;
        }

        window.addEventListener('load', () => {
            let webDiv = document.getElementById('works');
            for (let v of visuals) {
                webDiv.appendChild(createProjectBlock(v));
            }
        });
    </script>
</body>
</html>
