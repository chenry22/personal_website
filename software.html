        function changeProjColumn(col) {
            document.getElementsByClassName('active')[0].classList.remove('active');
            document.getElementById(col + '-selector').classList.add('active');

            for (let col of document.getElementsByClassName('projects')) {
                col.classList.add('hidden');
            }
            document.getElementById(col).classList.remove('hidden');
        }

        function createProjectBlock(data) {
            let container = document.createElement('div');
            container.classList.add('project');

            let thumb = document.createElement('div');
            thumb.classList.add('thumbnail');
            let img = document.createElement('img');
            img.src = data.image;
            thumb.appendChild(img);

            let infoBlock = document.createElement('div');
            infoBlock.classList.add('info');
            let title = document.createElement('div');
            title.classList.add('title');
            title.innerText = data.title;
            let date = document.createElement('div')
            date.classList.add('date');
            date.innerText = data.dateStr;

            let tags = document.createElement('div');
            tags.classList.add('tags');
            for (let t of data.tags) {
                let tag = document.createElement('div');
                tag.innerText = t;
                tags.appendChild(tag);
            }

            let details = document.createElement('details');
            let label = document.createElement('summary');
            label.innerText = "Summary";
            let desc = document.createElement('p');
            desc.innerText = data.desc;
            details.appendChild(label);
            details.appendChild(desc);

            let links = document.createElement('div');
            if (data.links) {
                links.classList.add('links');
                for (let l of data.links) {
                    let link = document.createElement('a');
                    link.target = '_blank';
                    link.href = l.link;

                    if (l.type === 'visit') {
                        link.innerText = "Visit";
                    } else if (l.type === 'github') {
                        let icon = document.createElement('i');
                        icon.classList.add('fa', 'fa-github');
                        link.appendChild(icon);
                    }
                    links.appendChild(link);
                }
            }

            infoBlock.appendChild(title);
            infoBlock.appendChild(date);
            infoBlock.appendChild(tags);
            infoBlock.appendChild(details);
            if (data.links) { infoBlock.appendChild(links); }
            container.appendChild(thumb);
            container.appendChild(infoBlock)
            return container;
        }

        window.addEventListener('load', () => {
            let webDiv = document.getElementById('web');
            for (let w of web) {
                webDiv.appendChild(createProjectBlock(w));
            }
            let appDiv = document.getElementById('mobile');
            for (let a of app) {
                appDiv.appendChild(createProjectBlock(a));
            }
            let dataDiv = document.getElementById('data');
            for (let d of data) {
                dataDiv.appendChild(createProjectBlock(d));
